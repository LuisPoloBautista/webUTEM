services:
  - type: web
    name: portal-metricas-utem
    runtime: static
    buildCommand: echo "Sitio estático listo"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
